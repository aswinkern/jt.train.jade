method: "patchcore"
gpu_id: 0
code_dir: "/jidoka/code/jt.train.jade"

customer:
    customer_name: "BorgWarner_138P"

data:
    data_dir: "/jidoka/simulations/jdisk3/jt.cust.anomaly_jade_v3/data_object_detection/data_3"
    image_extensions: ["*.png", "*.jpg", "*.jpeg"]
    batch_size: 8
    num_workers: 4
    image_size: [182, 952]

model:
    backbone:
        type: "wide_resnet50_2"
        weights_path: "/jidoka/code/jt.train.jade/patchcore/weights/wide_resnet50_2_imagenet.pth"
        layers: [2, 3]

    patch:
        neighbourhood: 3
        embed_dim: 1024

    memory:
        coreset_ratio: 0.1
        projection_dim: 128
        seed: 0

    blur_sigma: 4
    pixelwise_threshold: 0
    visualisation: "heatmap"
    # min_box_score: 1.25   # optional: predicted boxes whose score (largest error inside the box) is below it are dropped

output:
    checkpoint_dir: "@EXP@/checkpoints"
    tensorboard_dir: "@EXP@/tensorboard"
    results_dir: "@EXP@/results"
    calibration_pictures: 20
    ng_pictures: 10

# only for ./run.sh --export (ONNX for Triton): where the model is written, its name (a new fit = a new name, an existing model is never overwritten)
# and which run folder is exported (latest = the newest patchcore_* folder next to this config.yaml)
export:
    models_dir: "/jidoka/simulations/jdisk3/jt.cust.anomaly_jade_v3/models"
    model_name: "PatchCore_v1.0.0"
    experiment: "latest"
    # true also writes Serving_model/1/model_fp16.onnx. Needed to build a TensorRT 11 engine (RTX 50-series),
    # where trtexec has no --fp16 and the FP32 ONNX does not fit in 12 GB. See convert.md and tools/onnx_fp16.py.
    fp16: false
    # query patches per tile of the nearest-neighbour search, 0 = the whole picture at once.
    # TensorRT asks for one query x bank table and allocates it in one piece: 4.23 GB at
    # 518 x 518 with a bank of 245,050 patches. 512 bounds it at about 0.5 GB. Measured on
    # PatchCore_v1.0.0: the scores of all 307 labelled test pictures were bit-identical to the
    # untiled engine, inference stayed at 26.2 ms, and the server went from 5160 to 3210 MiB.
    # See the end of convert.md. Set 0 to go back to the old single-table behaviour.
    query_tile: 512

method: "jade"
gpu_id: 0
code_dir: "/jidoka/code/jt.train.jade"

customer:
    customer_name: "BorgWarner_138P"

data:
    data_dir: "/jidoka/simulations/jdisk3/jt.cust.anomaly_jade_v3/data_object_detection/data_1"
    image_extensions: ["*.png", "*.jpg", "*.jpeg"]
    batch_size: 8
    num_workers: 4
    image_size: [518, 518]
    augmentation:
        hsv_shift: true
        gaussian_blur: true
        random_vertical_shift: true
        random_horizontal_shift: true
        vertical_shift_frac: 0.03
        horizontal_shift_frac: 0.03
        random_window_mask: false

model:
    feature_extractor:
        type: "dinov2_vitl14_reg"
        weights_path: "/jidoka/models/jade/dinov2_vitl14_reg4_pretrain.pth"
        adapted_weights_path: ""
        trainable: false
        normalize_features: true
        layers: [5, 11, 17, 23]

    memory:
        bottleneck_size: 512
        learning_rate: 0.0001

    layer_weights: [1.0, 1.0, 1.0, 1.0]
    featurewise_threshold: 0.6
    pixelwise_threshold: 0

training:
    num_epochs: 50
    eval_frequency_epochs: 5
    checkpoint_frequency_epochs: 5
    checkpoint_dir: "@EXP@/checkpoints"
    tensorboard_dir: "@EXP@/tensorboard"

export:
    models_dir: "/jidoka/simulations/jdisk3/jt.cust.anomaly_jade_v3/models"
    model_name: "Anomaly_v1.0.0"
    experiment: "latest"
    epoch: 50

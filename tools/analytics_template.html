<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detection analytics</title>
<style>
:root{
  --bg:#f2f4f8; --surface:#ffffff; --text:#18202c; --muted:#5a6678; --line:#dfe4ec; --grid:#eceff4;
  --okay:#0072B2; --defect:#E69F00; --label:#009E73; --pred:#D55E00; --accent:#1d4f91; --accent-soft:#e8eff9;
  --good:#1b8a45; --warn:#6cbf84; --bad:#d63a32; --warn-bg:#fff4e0; --shadow:0 1px 2px rgba(16,28,48,.06),0 4px 14px rgba(16,28,48,.05);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg);color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 56px}
header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--accent);margin:0 -16px 20px;padding:20px 16px 16px}
header .in{max-width:1288px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
h1{margin:2px 0 8px;font-size:28px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--grid);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:12.5px;color:var(--muted)}
h2{margin:0 0 6px;font-size:18px;font-weight:700;letter-spacing:-.005em}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{margin:0 0 12px;color:var(--muted);font-size:13px}
.nav{display:flex;align-items:center;gap:8px;margin:-6px 0 16px;border-bottom:2px solid var(--line)}
.nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 18px;font-weight:700;font-size:15px;color:var(--muted);margin-bottom:-2px}
.nav button[aria-pressed="true"]{background:none;color:var(--accent);border-bottom-color:var(--accent)}
.nav button:hover{color:var(--accent);border-color:transparent;border-bottom-color:var(--accent)}
.nav .grow{flex:1}
.controls .row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.controls label{font-weight:600}
.controls input[type=range]{width:min(420px,70vw);vertical-align:middle;accent-color:var(--accent)}
.controls output{display:inline-block;min-width:4.5em;font-variant-numeric:tabular-nums;font-weight:650}
button,select,input[type=search]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 16px}
.kpi{border-left:5px solid var(--c,var(--accent));padding:12px 16px;background:#fafbfd;border-radius:10px;border-top:1px solid var(--grid);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.kpi .t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .v{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .v small{font-size:16px;font-weight:600;color:var(--muted)}
.kpi .s{font-size:13px;color:var(--muted)}
.verdict{font-size:15px;color:var(--muted)}
.sec{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.sec .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:16px}
.grid2 .panel{margin-bottom:0}
svg text{fill:var(--muted);font:12px system-ui,sans-serif}
svg .ax{stroke:var(--line);stroke-width:1}
svg .gl{stroke:var(--grid);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 0;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--grid)}
td.num,th.num{text-align:right}
.conf td,.conf th{text-align:right}
.conf td:first-child,.conf th:first-child{text-align:left}
.bar{display:grid;grid-template-columns:110px 1fr 160px;gap:10px;align-items:center;margin:7px 0}
.bar .track{height:16px;background:#f3c9c6;border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--label)}
.bar .nm{font-weight:600}
.bar .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,28,48,.05);cursor:pointer;display:block;text-align:left;padding:0;color:inherit}
.card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(16,28,48,.12)}
.card .cap{padding:6px 10px 8px;font-size:12.5px}
.card .cap .nm{font-weight:600;word-break:break-all}
.thumb{position:relative;background:#000;line-height:0}
.thumb img,.thumb svg{width:100%;height:auto;display:block}
.thumb svg{position:absolute;inset:0;height:100%}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;margin-right:6px;background:var(--bg)}
.more{display:block;margin:14px auto 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:0;width:min(1180px,96vw);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
.dlg .main{padding:12px;background:#000}
.dlg .side{padding:14px;overflow:auto;max-height:80vh}
.dlg .bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
.dlg .bar2 strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .bar2 span{flex:none;white-space:nowrap}
.dlg ul{margin:6px 0;padding-left:18px}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:20;display:none;white-space:nowrap}
.how{background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.how b{font-weight:650}
@media (max-width:820px){.dlg{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr}.bar .ct{grid-column:1 / -1}}

.verdict{line-height:1.55;margin:4px 0 14px}
.verdict b{font-weight:700}
.charts4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.charts4 figure{margin:0;background:#fafbfd;border:1px solid var(--grid);border-radius:12px;padding:14px}
.charts4 figcaption{font-weight:650;margin-bottom:6px}
.charts4 figcaption span{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.lg{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.lg li{margin:3px 0}
svg .dbig{font:700 22px system-ui,sans-serif;fill:var(--text)}
svg .dsm{font:12px system-ui,sans-serif;fill:var(--muted)}
svg .slice{font:700 9.5px system-ui,sans-serif;fill:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
.exg{margin:0 0 22px}
.exh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.exh h3{margin:0;font-size:16px}
.cls-note{font-size:13px;color:var(--muted)}
details.more>summary,details.adv>summary{cursor:pointer;font-weight:650;font-size:16px}
details.adv{display:inline-block;margin-left:6px}
details.adv>summary{font-size:13.5px;font-weight:600;color:var(--muted)}
details.adv .box{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.warnbar{background:var(--warn-bg);border:1px solid #e0b45a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.about h3{margin:14px 0 4px;font-size:15px}
.defs td:nth-child(2){color:var(--muted)}
.defs td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.about ul{margin:4px 0 8px;padding-left:20px}
.about li{margin:3px 0}
.range{color:var(--muted);font-size:14px}
#settab td,#settab th{vertical-align:top}
#settab td.v{font-weight:700;white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;background:var(--bg);white-space:nowrap}
code{background:var(--grid);border-radius:4px;padding:0 4px;font-size:.92em}
</style>
</head>
<body>
<div class="wrap">
<header><div class="in">
  <div class="eyebrow">Anomaly detection report</div>
  <h1 id="title">Detection analytics</h1>
  <div class="chips" id="sub"></div>
</div></header>

<nav class="nav" aria-label="Pages">
  <button id="nav-stats" aria-pressed="true">Statistics</button>
  <button id="nav-pics" aria-pressed="false">Pictures</button>
  <span class="grow"></span><details class="adv"><summary>Advanced</summary><div class="box">
      <label class="small">Match rule <select id="rule" aria-label="Match rule">
        <option value="overlap">overlap: label touches the box</option>
        <option value="half">half: at least 50% of the label inside the box</option>
        <option value="centre">centre: centre of the label inside the box</option></select></label></div></details>
</nav>

<main id="page-stats">
<div id="banner"></div>
<section class="panel" id="glance">
  <h2>At a glance</h2>
  <div class="kpis" id="kpis"></div>
  <div class="charts4">
    <figure><figcaption>Defect pictures</figcaption><div id="pie-def"></div><ul class="lg" id="lg-def"></ul></figure>
    <figure><figcaption>Okay pictures</figcaption><div id="pie-ok"></div><ul class="lg" id="lg-ok"></ul></figure>
    <figure><figcaption>Labelled defects found<span>by class</span></figcaption><div id="bars-cls"></div></figure>
  </div>
</section>
<details class="panel more" id="settings"><summary>Settings and data check</summary>
  <div style="height:8px"></div>
  <table id="settab"></table>
  <div id="about-body" style="margin-top:16px"></div>
</details>
</main>
<main id="page-pics" hidden>
<section class="panel" id="browser">
  <h2>All pictures</h2>
  <p class="hint"><span class="sw" style="background:var(--label)"></span>label &nbsp; <span class="sw" style="background:var(--pred)"></span>box, solid = correct, dotted = wrong &nbsp; <span class="sw" style="background:#c9d1db"></span>defect_1 to defect_4 marks</p>
  <div class="tabs" role="tablist"><button id="tab-gal" aria-pressed="true">Gallery</button><button id="tab-tab" aria-pressed="false">Table</button></div>
  <div class="filters">
    <span id="chips"></span>
    <label class="small">Class <select id="clsSel"></select></label>
    <label class="small">Sort <select id="sortSel">
      <option value="score_desc">Score, high to low</option><option value="score_asc">Score, low to high</option>
      <option value="name">Name</option><option value="missed">Most labelled defects missed</option></select></label>
    <input type="search" id="q" placeholder="Search name" aria-label="Search by name">
    <span class="muted small" id="count"></span>
  </div>
  <div id="gallery" class="gal"></div>
  <div id="tablewrap" hidden></div>
  <button class="more" id="more" hidden>Show more</button>
</section>
</main>














</div>

<dialog id="viewer" aria-label="Picture viewer">
  <div class="bar2"><strong id="v-title" class="small" title=""></strong>
    <span><button id="v-prev" aria-label="Previous picture">&larr;</button> <button id="v-next" aria-label="Next picture">&rarr;</button> <button id="v-close">Close</button></span></div>
  <div class="dlg">
    <div class="main"><div class="thumb" id="v-img"></div></div>
    <div class="side" id="v-side"></div>
  </div>
</dialog>
<div class="tip" id="tip"></div>

<script id="data" type="application/json">/*__DATA__*/</script>

<script id="logic">
/* ---------- logic: no DOM ---------- */
const Logic = (function () {
  function inter(a, b) {
    const w = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1), h = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1);
    return (w > 0 && h > 0) ? w * h : 0;
  }
  const area = b => Math.max(0, b.x2 - b.x1) * Math.max(0, b.y2 - b.y1);

  function prepare(D) {
    const okCls = new Set(D.meta.okay_classes);
    D.pictures.forEach((p, i) => {
      p.i = i;
      p.defLabels = p.labels.filter(l => !okCls.has(l.c));
      p.markLabels = p.labels.filter(l => okCls.has(l.c));
    });
    D.okayScores = D.pictures.filter(p => p.group === 'okay').map(p => p.score).sort((a, b) => b - a);
    D.defectScores = D.pictures.filter(p => p.group === 'defect').map(p => p.score).sort((a, b) => b - a);
    D.classes = Array.from(new Set([].concat(...D.pictures.map(p => p.defLabels.map(l => l.c))))).sort();
    return D;
  }

  // is the labelled box l "in the region" of the predicted box b?
  function matches(l, b, rule) {
    if (rule === 'centre') { const cx = (l.x1 + l.x2) / 2, cy = (l.y1 + l.y2) / 2; return cx >= b.x1 && cx <= b.x2 && cy >= b.y1 && cy <= b.y2; }
    const i = inter(l, b);
    if (rule === 'half') { const a = area(l); return a > 0 && i / a >= 0.5; }
    return i > 0;                                                   // 'overlap': the label touches the box
  }

  // everything that depends on the match rule
  // a predicted box is correct (ok) when a labelled defect is in its region; a labelled defect is found when a predicted box has it in its region
  function evaluate(D, rule) {
    rule = rule || 'overlap';
    const m = { rule, nOk: 0, nDef: 0, caught: 0, caughtRight: 0, falseAlarm: 0, labTot: 0, labFound: 0, boxes: 0, boxesHit: 0, byClass: {}, per: [] };
    D.classes.forEach(c => { m.byClass[c] = { total: 0, found: 0 }; });
    D.pictures.forEach(p => {
      const active = p.boxes.map(b => Object.assign({}, b, { ok: p.defLabels.some(l => matches(l, b, rule)) }));
      const flagged = active.length > 0;          // a picture is flagged when the model drew at least one box on it
      let found = 0;
      const foundFlags = p.defLabels.map(l => {
        const ok = active.some(b => matches(l, b, rule));
        m.byClass[l.c].total++; if (ok) { m.byClass[l.c].found++; found++; }
        return ok;
      });
      const hit = active.filter(b => b.ok).length;
      m.boxes += active.length; m.boxesHit += hit;
      m.labTot += p.defLabels.length; m.labFound += found;
      let status;
      if (p.group === 'defect') {
        m.nDef++;
        if (flagged) { m.caught++; if (hit > 0) { m.caughtRight++; status = 'caught'; } else status = 'wrong'; } else status = 'missed';
      } else { m.nOk++; if (flagged) { m.falseAlarm++; status = 'false'; } else status = 'correct'; }
      m.per.push({ p, active, flagged, found, foundFlags, hit, status });
    });
    return m;
  }

  function wilson(k, n) {
    if (!n) return [0, 0];
    const z = 1.96, p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n), h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
    return [(c - h) / d, (c + h) / d];
  }
  return { inter, area, matches, prepare, evaluate, wilson };
})();
if (typeof module !== 'undefined') module.exports = Logic;
</script>

<script id="ui">
(function () {
  if (typeof document === 'undefined') return;
  const D = Logic.prepare(JSON.parse(document.getElementById('data').textContent));
  const $ = id => document.getElementById(id);
  const fmt = (v, d) => v.toFixed(d === undefined ? 2 : d);
  const pct = (a, b) => b ? (100 * a / b).toFixed(1) + '%' : '-';
  const p0 = x => (100 * x).toFixed(0) + '%';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const STATUS = { caught: ['✓', 'TP right place'], wrong: ['⚠', 'TP wrong place'], missed: ['✗', 'FN'], false: ['!', 'FP'], correct: ['✓', 'TN'] };
  const state = { rule: 'overlap', filter: 'all', cls: '', sort: 'score_desc', q: '', view: 'gallery', shown: 48, open: -1, tsort: ['score', -1] };
  let M = null, list = [], nav = [];

  $('title').textContent = D.meta.title;
  $('sub').innerHTML = D.meta.subtitle.split(' | ').map(x => '<span class="chip">' + esc(x) + '</span>').join('');
  document.title = D.meta.title;

  /* controls */
  const CFG = D.meta.settings || {};
  const imgSrc = p => D.images[p.heat !== undefined ? p.heat : p.img];      // the heat map picture (plain picture when no box passes min_box_score)
  function showPage(p) {
    $('page-stats').hidden = p !== 'stats'; $('page-pics').hidden = p !== 'pics';
    $('nav-stats').setAttribute('aria-pressed', p === 'stats'); $('nav-pics').setAttribute('aria-pressed', p === 'pics');
    try { history.replaceState(null, '', p === 'pics' ? '#pictures' : '#statistics'); } catch (e) {}
    window.scrollTo(0, 0);
  }
  $('nav-stats').addEventListener('click', () => showPage('stats'));
  $('nav-pics').addEventListener('click', () => showPage('pics'));
  if (location.hash === '#pictures') showPage('pics');
  $('rule').addEventListener('change', e => { state.rule = e.target.value; schedule(); });
  let pending = false;
  function schedule() { if (!pending) { pending = true; setTimeout(() => { pending = false; renderAll(); }, 0); } }

  /* tooltip */
  const tip = $('tip');
  function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - r.width - 8, e.clientX + 14) + 'px'; tip.style.top = Math.max(8, e.clientY - r.height - 10) + 'px'; }
  function hideTip() { tip.style.display = 'none'; }

  /* charts */
  function svgOpen(w, h, label) { return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="' + esc(label) + '" style="display:block">'; }
  /* at a glance */
  function donut(id, parts, big, small, label) {
    const total = parts.reduce((s, p) => s + p.v, 0), R = 52, C = 2 * Math.PI * R;
    let s = '<svg viewBox="0 0 140 140" width="100%" style="max-width:210px;display:block;margin:0 auto" role="img" aria-label="' + esc(label) + '">';
    s += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--grid)" stroke-width="24"/>';
    let off = 0, labels = '';
    parts.forEach((p, i) => {
      if (p.v <= 0 || !total) return;
      const len = p.v / total * C, gap = Math.min(2, len * 0.2);
      s += '<circle class="seg" data-i="' + i + '" cx="70" cy="70" r="' + R + '" fill="none" stroke="' + p.c + '" stroke-width="24" stroke-dasharray="' + (len - gap) + ' ' + (C - len + gap) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>';
      if (p.v / total >= 0.07) {
        const a = (off + len / 2) / C * 2 * Math.PI - Math.PI / 2;
        labels += '<text class="slice" stroke="' + p.c + '" x="' + (70 + R * Math.cos(a)).toFixed(1) + '" y="' + (70 + R * Math.sin(a) + 3.5).toFixed(1) + '" text-anchor="middle">' + (100 * p.v / total).toFixed(1) + '%</text>';
      }
      off += len;
    });
    s += labels + '<text class="dbig" x="70" y="70" text-anchor="middle" style="font-size:22px">' + big + '</text><text class="dsm" x="70" y="86" text-anchor="middle">' + small + '</text></svg>';
    $(id).innerHTML = s;
    $(id).querySelectorAll('.seg').forEach(c => {
      const p = parts[+c.dataset.i];
      c.addEventListener('mousemove', e => showTip(e, '<b>' + esc(p.l) + '</b><br>' + p.v + ' of ' + total + ' (' + pct(p.v, total) + ')'));
      c.addEventListener('mouseleave', hideTip);
    });
    $(id.replace('pie', 'lg')).innerHTML = parts.map(p => '<li><span class="sw" style="background:' + p.c + '"></span>' + esc(p.l) + ': <b>' + p.v + '</b></li>').join('');
  }
  const p1 = x => (100 * x).toFixed(1) + '%';
  function renderGlance() {
    const tn = M.nOk - M.falseAlarm, ci1 = Logic.wilson(M.caught, M.nDef), ci2 = Logic.wilson(tn, M.nOk), ci4 = Logic.wilson(M.labFound, M.labTot);
    const kp = (t, a, b, c, ci) => '<div class="kpi" style="--c:' + c + '"><div class="t">' + t + '</div><div class="v">' + pct(a, b) + '</div><div class="s">' + a + ' / ' + b + ' &middot; 95% CI ' + p1(ci[0]) + ' to ' + p1(ci[1]) + '</div></div>';
    $('kpis').innerHTML =
      kp('Sensitivity', M.caught, M.nDef, 'var(--good)', ci1) +
      kp('Specificity', tn, M.nOk, 'var(--good)', ci2) +
      kp('Labelled defects found', M.labFound, M.labTot, 'var(--good)', ci4);
    donut('pie-def', [{ l: 'TP, box on a labelled defect', v: M.caughtRight, c: 'var(--good)' }, { l: 'TP, no box on a labelled defect', v: M.caught - M.caughtRight, c: 'var(--warn)' }, { l: 'FN, missed', v: M.nDef - M.caught, c: 'var(--bad)' }],
      String(M.nDef), 'pictures', 'Defect pictures: ' + M.caughtRight + ' TP with a box on a defect, ' + (M.caught - M.caughtRight) + ' TP elsewhere, ' + (M.nDef - M.caught) + ' FN');
    donut('pie-ok', [{ l: 'TN, not flagged', v: tn, c: 'var(--good)' }, { l: 'FP, flagged', v: M.falseAlarm, c: 'var(--bad)' }],
      String(M.nOk), 'pictures', 'Okay pictures: ' + tn + ' TN, ' + M.falseAlarm + ' FP');
    const rows = D.classes.map(c => [c, M.byClass[c]]).sort((a, b) => b[1].total - a[1].total);
    $('bars-cls').innerHTML = rows.length ? rows.map(r => {
      const f = r[1].found, t = r[1].total, w = t ? 100 * f / t : 0;
      return '<div class="bar" style="grid-template-columns:96px 1fr"><span class="nm">' + esc(r[0]) + '</span><div><div class="track" role="img" aria-label="' + esc(r[0]) + ': ' + f + ' of ' + t + ' found"><div class="fill" style="width:' + w + '%;background:var(--good)"></div></div><span class="ct"><b>' + pct(f, t) + '</b> &middot; ' + f + ' of ' + t + ' found</span></div></div>';
    }).join('') : '';
  }

  /* settings behind the results */
  function renderSettings() {
    const has = v => v !== undefined && v !== null;
    const row = (key, val, who) => '<tr><td><code>' + key + '</code></td><td class="v">' + val + '</td><td><span class="tag">' + who + '</span></td></tr>';
    $('settab').innerHTML = '<thead><tr><th>config.yaml</th><th>Value</th><th>Set by</th></tr></thead><tbody>' +
      row('min_box_score', has(CFG.min_box_score) ? CFG.min_box_score : 'not set', 'you') +
      row('pixelwise_threshold', has(CFG.pixelwise_threshold) ? CFG.pixelwise_threshold : '?', 'you') +
      row('heatmap_scaling_factor', has(CFG.heatmap_scaling_factor) ? CFG.heatmap_scaling_factor : '?', './run.sh after the fit') +
      row('heatmap_floor', has(CFG.heatmap_floor) ? CFG.heatmap_floor : '?', './run.sh after the fit') +
      '</tbody>';
  }

  /* definitions */
  function renderAbout() {
    const k = D.meta.checks || {};
    const nLab = D.pictures.reduce((s, p) => s + p.defLabels.length, 0);
    const cls = D.classes.map(c => c + ' ' + D.pictures.reduce((s, p) => s + p.defLabels.filter(l => l.c === c).length, 0)).join(' &middot; ');
    const r = (a, b, c) => '<tr><td><b>' + a + '</b></td><td>' + b + '</td><td class="num">' + (c === undefined ? '' : c) + '</td></tr>';
    $('about-body').innerHTML =
      '<table class="defs"><thead><tr><th>Data check</th><th></th><th class="num">Value</th></tr></thead><tbody>' +
      r('Labelled defects', cls, nLab) +
      r('Test pictures also in the memory bank', esc(k.bank_data || ''), (k.overlap === undefined || k.overlap === null) ? 'not checked' : k.overlap) +
      r('Pictures without a label file', '', k.missing_labels || 0) + r('Box files without a picture', '', k.skipped || 0) +
      '</tbody></table>';
    $('banner').innerHTML = (k.overlap > 0) ? '<div class="warnbar"><b>' + k.overlap + '</b> test pictures are also in the memory bank data (' + esc(k.bank_data || '') + ')</div>' : '';
  }
  /* picture browser */
  const counts = () => { const c = { all: M.per.length, caught: 0, wrong: 0, missed: 0, false: 0, correct: 0 }; M.per.forEach(r => c[r.status]++); return c; };
  function renderChips() {
    const c = counts();
    const defs = [['all', 'All'], ['caught', 'TP right place'], ['wrong', 'TP wrong place'], ['missed', 'FN'], ['false', 'FP'], ['correct', 'TN']];
    $('chips').innerHTML = defs.map(d => '<button data-f="' + d[0] + '" aria-pressed="' + (state.filter === d[0]) + '">' + d[1] + '</button>').join(' ');
    $('chips').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { state.filter = b.dataset.f; state.shown = 48; renderBrowser(); }));
  }
  function rows() {
    let r = M.per.filter(x => (state.filter === 'all' || x.status === state.filter) &&
      (!state.cls || x.p.defLabels.some(l => l.c === state.cls)) &&
      (!state.q || x.p.name.toLowerCase().indexOf(state.q.toLowerCase()) >= 0));
    const s = state.sort;
    r.sort((a, b) => s === 'score_asc' ? a.p.score - b.p.score : s === 'name' ? a.p.name.localeCompare(b.p.name) :
      s === 'missed' ? (b.p.defLabels.length - b.found) - (a.p.defLabels.length - a.found) || b.p.score - a.p.score : b.p.score - a.p.score);
    return r;
  }
  function overlay(r, opts) {
    const p = r.p, o = opts || { labels: true, marks: true, preds: true };
    let s = '<svg viewBox="0 0 ' + p.w + ' ' + p.h + '" preserveAspectRatio="none" aria-hidden="true">';
    if (o.marks) p.markLabels.forEach(l => { s += '<rect x="' + l.x1 + '" y="' + l.y1 + '" width="' + (l.x2 - l.x1) + '" height="' + (l.y2 - l.y1) + '" fill="none" stroke="#c9d1db" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>'; });
    if (o.labels) p.defLabels.forEach((l, i) => { s += '<rect x="' + l.x1 + '" y="' + l.y1 + '" width="' + (l.x2 - l.x1) + '" height="' + (l.y2 - l.y1) + '" fill="none" stroke="var(--label)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>'; });
    if (o.preds) r.active.forEach(b => { s += '<rect x="' + b.x1 + '" y="' + b.y1 + '" width="' + (b.x2 - b.x1) + '" height="' + (b.y2 - b.y1) + '" fill="' + (b.ok ? 'var(--pred)' : 'none') + '" fill-opacity=".10" stroke="var(--pred)" stroke-width="2.5"' + (b.ok ? '' : ' stroke-dasharray="3 4"') + ' vector-effect="non-scaling-stroke"/>' +
      '<text x="' + (b.x1 + 5) + '" y="' + (b.y1 + p.w * 0.04) + '" style="font-size:' + (p.w * 0.04) + 'px;font-weight:700" fill="#fff" stroke="var(--pred)" stroke-width="' + (p.w * 0.008) + '" paint-order="stroke" stroke-linejoin="round">' + fmt(b.score, 2) + '</text>'; });
    return s + '</svg>';
  }
  function card(r) {
    const st = STATUS[r.status], p = r.p;
    return '<button class="card" data-i="' + p.i + '"><div class="thumb"><img loading="lazy" alt="" src="' + imgSrc(p) + '">' + overlay(r) + '</div>' +
      '<div class="cap"><div class="nm">' + esc(p.name) + '</div><span class="badge">' + st[0] + ' ' + st[1] + '</span>score ' + fmt(p.score) + ' &middot; ' + r.active.length + ' boxes' +
      (p.defLabels.length ? ' &middot; ' + r.found + '/' + p.defLabels.length + ' labels found' : '') + '</div></button>';
  }
  function renderTable() {
    const cols = [['name', 'Picture', false], ['group', 'Group', false], ['score', 'Score', true], ['boxes', 'Boxes', true], ['lab', 'Labelled defects', true], ['found', 'Found', true], ['status', 'Result', false]];
    const key = { name: x => x.p.name, group: x => x.p.group, score: x => x.p.score, boxes: x => x.active.length, lab: x => x.p.defLabels.length, found: x => x.found, status: x => STATUS[x.status][1] };
    const [k, dir] = state.tsort, rr = list.slice().sort((a, b) => { const A = key[k](a), B = key[k](b); return (A < B ? -1 : A > B ? 1 : 0) * dir; });
    let s = '<table><thead><tr>' + cols.map(c => '<th class="sortable' + (c[2] ? ' num' : '') + '" data-k="' + c[0] + '" aria-sort="' + (k === c[0] ? (dir > 0 ? 'ascending' : 'descending') : 'none') + '">' + c[1] + (k === c[0] ? (dir > 0 ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr></thead><tbody>';
    rr.slice(0, 400).forEach(r => { s += '<tr class="click" data-i="' + r.p.i + '"><td>' + esc(r.p.name) + '</td><td>' + r.p.group + '</td><td class="num">' + fmt(r.p.score) + '</td><td class="num">' + r.active.length + '</td><td class="num">' + r.p.defLabels.length + '</td><td class="num">' + r.found + '</td><td>' + STATUS[r.status][0] + ' ' + STATUS[r.status][1] + '</td></tr>'; });
    $('tablewrap').innerHTML = s + '</tbody></table>' + (rr.length > 400 ? '<p class="muted small">First 400 rows of ' + rr.length + '. Use the filters above.</p>' : '');
    $('tablewrap').querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => { const kk = th.dataset.k; state.tsort = [kk, state.tsort[0] === kk ? -state.tsort[1] : (kk === 'name' || kk === 'group' || kk === 'status' ? 1 : -1)]; renderTable(); }));
    $('tablewrap').querySelectorAll('tr.click').forEach(tr => tr.addEventListener('click', () => openViewer(+tr.dataset.i)));
  }
  function renderBrowser() {
    renderChips();
    list = rows(); nav = list;
    $('count').textContent = list.length + ' pictures';
    const gal = state.view === 'gallery';
    $('gallery').hidden = !gal; $('tablewrap').hidden = gal; $('more').hidden = !(gal && list.length > state.shown);
    $('tab-gal').setAttribute('aria-pressed', gal); $('tab-tab').setAttribute('aria-pressed', !gal);
    if (gal) {
      $('gallery').innerHTML = list.slice(0, state.shown).map(card).join('');
      $('gallery').querySelectorAll('.card').forEach(c => c.addEventListener('click', () => openViewer(+c.dataset.i)));
    } else renderTable();
  }
  $('more').addEventListener('click', () => { state.shown += 48; renderBrowser(); });
  $('tab-gal').addEventListener('click', () => { state.view = 'gallery'; renderBrowser(); });
  $('tab-tab').addEventListener('click', () => { state.view = 'table'; renderBrowser(); });
  $('sortSel').addEventListener('change', e => { state.sort = e.target.value; renderBrowser(); });
  $('clsSel').innerHTML = '<option value="">All</option>' + D.classes.map(c => '<option>' + esc(c) + '</option>').join('');
  $('clsSel').addEventListener('change', e => { state.cls = e.target.value; state.shown = 48; renderBrowser(); });
  $('q').addEventListener('input', e => { state.q = e.target.value; state.shown = 48; renderBrowser(); });

  /* viewer */
  const V = { labels: true, marks: true, preds: true };
  function openViewer(i) {
    state.open = i; const r = M.per[i], p = r.p, st = STATUS[r.status];
    $('v-title').textContent = p.name + '  |  ' + st[0] + ' ' + st[1] + '  |  score ' + fmt(p.score, 3); $('v-title').title = $('v-title').textContent;
    $('v-img').innerHTML = '<img alt="" src="' + imgSrc(p) + '">' + overlay(r, V);
    const lab = p.defLabels.map((l, k) => '<li>' + esc(l.c) + ' (' + l.x1 + ',' + l.y1 + ',' + l.x2 + ',' + l.y2 + ') ' + (r.foundFlags[k] ? '<b>✓ found</b>' : '<b>✗ missed</b>') + '</li>').join('');
    const prs = r.active.map(b => '<li>score ' + fmt(b.score) + ' (' + b.x1 + ',' + b.y1 + ',' + b.x2 + ',' + b.y2 + ') ' + (b.ok ? '<b>✓ correct</b>' : '<b>✗ wrong</b>') + '</li>').join('');
    $('v-side').innerHTML =
      '<p class="small muted" style="margin-top:0">' + p.group + ' &middot; ' + p.w + ' x ' + (D.meta.full_height || p.h) + ' px</p>' +
      '<label class="small"><input type="checkbox" id="tg-l" ' + (V.labels ? 'checked' : '') + '> labels</label><br>' +
      '<label class="small"><input type="checkbox" id="tg-m" ' + (V.marks ? 'checked' : '') + '> defect_1 to defect_4 marks</label><br>' +
      '<label class="small"><input type="checkbox" id="tg-p" ' + (V.preds ? 'checked' : '') + '> predicted boxes</label>' +
      '<h2 style="margin-top:14px">Labelled defects</h2>' + (lab ? '<ul class="small">' + lab + '</ul>' : '<p class="muted small">None.</p>') +
      '<h2>Predicted boxes (' + r.active.length + ', ' + r.hit + ' correct)</h2>' + (prs ? '<ul class="small">' + prs + '</ul>' : '<p class="muted small">0</p>') +
      '<p class="small muted">defect_1 to defect_4 marks: ' + p.markLabels.length + '</p>';
    ['l', 'm', 'p'].forEach(k => $('tg-' + k).addEventListener('change', e => { V[{ l: 'labels', m: 'marks', p: 'preds' }[k]] = e.target.checked; openViewer(state.open); }));
    if (!$('viewer').open) $('viewer').showModal();
  }
  $('v-close').addEventListener('click', () => $('viewer').close());
  function step(d) { if (!nav.length) return; const pos = nav.findIndex(r => r.p.i === state.open); const n = nav[(pos + d + nav.length) % nav.length]; openViewer(n.p.i); }
  $('v-prev').addEventListener('click', () => step(-1)); $('v-next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', e => { if (!$('viewer').open) return; if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); });
  $('viewer').addEventListener('click', e => { if (e.target === $('viewer')) $('viewer').close(); });


  function renderAll() {
    M = Logic.evaluate(D, state.rule);
    renderGlance(); renderBrowser();
    if ($('viewer').open && state.open >= 0) openViewer(state.open);
  }
  renderSettings();
  renderAbout();
  schedule();
})();
</script>
</body>
</html>
